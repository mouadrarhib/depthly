troke="#30313b" fill="none"/><text x="452" y="587" font-size="12" fill="#aaa7ba" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="start">Edit the title, notes, project, or task.</text><text x="452" y="610" font-size="12" fill="#aaa7ba" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="start">Recorded time stays unchanged.</text><path d="M420 634L1020 634" stroke="#30313b" fill="none"/><rect x="688" y="658" width="100" height="44" rx="8" fill="#14161d" stroke="#40424d"/><text x="738" y="686" font-size="13" fill="#e8e6f0" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="middle">Close</text><rect x="800" y="658" width="188" height="44" rx="8" fill="#4b9eff" stroke="none"/><text x="894" y="686" font-size="13" fill="#0c1725" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-weight="600" text-anchor="middle">Edit details</text><text x="112" y="947" font-size="12" fill="#aaa7ba" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="start">Design proposal · duration is recorded focus time, which can differ from elapsed start–end time when a session is paused.</text><text x="112" y="974" font-size="12" fill="#858299" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-weight="400" text-anchor="start">Long notes scroll within the dialog; footer actions stay visible. Application code is unchanged.</text></svg>