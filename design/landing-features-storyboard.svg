  <!-- Existing Overview section becomes a visual workflow -->
  <text x="88" y="616" font-size="32" font-weight="600" letter-spacing="-.8">One session connects your work to your progress.</text>
  <text x="88" y="647" class="body muted">Projects keep tasks together. A focus session records the time you spend on one.</text>
  <path d="M214 795H1220" class="flow"/>
  <g>
