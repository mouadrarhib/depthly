  <text x="88" y="982" class="tiny muted" letter-spacing="1.4">FOCUS, WITHOUT LOSING YOUR PLACE</text>
  <text x="88" y="1026" font-size="31" font-weight="600">Pick up where you left off.</text>
  <text x="88" y="1060" class="body muted">Start a session for a task. Pause or switch tabs;</text><text x="88" y="1084" class="body muted">your timer keeps its place.</text>
  <text x="88" y="1140" font-size="14" font-weight="600">After you finish</text>
