<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2780" viewBox="0 0 1440 2780" role="img" aria-labelledby="title description">
  <title id="title">Depthly landing page feature storyboard</title>
  <desc id="description">Animated concept for the existing Depthly landing page sections: focus workflow, project and task organization, daily goals and analytics, sharing progress, optional private focus groups, and pricing. Copy speaks to both students and freelancers.</desc>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #E8E6F0; }
    .muted { fill: #9290A4; }
    .quiet { fill: #69677B; }
    .tiny { font-size: 11px; }
    .small { font-size: 13px; }
    .body { font-size: 15px; }
    .surface { fill: #141417; stroke: #2E2E38; stroke-width: 1; }
    .line { stroke: #2E2E38; stroke-width: 1; }
    .flow { stroke: #4B9EFF; stroke-width: 2; fill: none; stroke-dasharray: 7 8; animation: draw 2.8s ease-out infinite; }
    .timer-ring { stroke-dasharray: 184 500; stroke-dashoffset: 0; animation: timer 8s linear infinite; transform-origin: center; }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 850ms cubic-bezier(.16,1,.3,1) both; }
    .bar:nth-child(2) { animation-delay: 120ms; }
    .bar:nth-child(3) { animation-delay: 240ms; }
    .bar:nth-child(4) { animation-delay: 360ms; }
    .bar:nth-child(5) { animation-delay: 480ms; }
    .task-card { animation: arrive 700ms cubic-bezier(.16,1,.3,1) both; }
    .task-card:nth-of-type(2) { animation-delay: 120ms; }
    .task-card:nth-of-type(3) { animation-delay: 240ms; }
    .group-row { animation: arrive 650ms cubic-bezier(.16,1,.3,1) both; }
    .group-row:nth-of-type(2) { animation-delay: 100ms; }
    .group-row:nth-of-type(3) { animation-delay: 200ms; }
    .group-row:nth-of-type(4) { animation-delay: 300ms; }
    @keyframes draw { to { stroke-dashoffset: -60; } }
    @keyframes timer { to { stroke-dashoffset: -684; } }
    @keyframes grow { from { transform: scaleY(.15); opacity: .45; } to { transform: scaleY(1); opacity: 1; } }
    @keyframes arrive { from { transform: translateY(12px); opacity: .3; } to { transform: translateY(0); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151C28"/><stop offset="1" stop-color="#0D0D10"/></linearGradient>
    <linearGradient id="blueFill" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4B9EFF"/><stop offset="1" stop-color="#78B8FF"/></linearGradient>
    <clipPath id="heroPreview"><rect x="760" y="158" width="570" height="286" rx="18"/></clipPath>
  </defs>
  <rect width="1440" height="2780" fill="#0D0D10"/>

