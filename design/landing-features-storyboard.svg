  <circle cx="78" cy="36" r="14" fill="none" stroke="#E8E6F0" stroke-width="1.5"/><circle cx="78" cy="36" r="8" fill="none" stroke="#7A7890"/><circle cx="78" cy="36" r="3" fill="#4B9EFF"/>
  <text x="102" y="42" font-size="17" font-weight="650">Depthly</text><text x="180" y="42" class="tiny muted">Stay focused, work deeper</text>
  <text x="460" y="42" class="small muted">Features</text><text x="540" y="42" class="small muted">Pricing</text>
  <text x="1190" y="42" class="small muted">Log in</text><rect x="1250" y="17" width="104" height="40" rx="9" fill="#4B9EFF"/><text x="1302" y="42" text-anchor="middle" font-size="13" font-weight="650" style="fill:#0D0D10">Start free</text>

  <!-- Hero -->
  <rect x="0" y="72" width="1440" height="470" fill="url(#heroBg)"/>
  <text x="88" y="218" font-size="50" font-weight="600" letter-spacing="-1.8">Focus on the work.</text>
  <text x="88" y="275" font-size="50" font-weight="600" letter-spacing="-1.8" style="fill:#4B9EFF">We’ll track the time.</text>
  <text x="88" y="326" class="body muted">For study, client work, and everything you want to finish.</text>
  <text x="88" y="352" class="body muted">Choose a task, focus, and see where your time goes.</text>
  <rect x="88" y="387" width="158" height="48" rx="10" fill="#4B9EFF"/><text x="167" y="417" text-anchor="middle" font-size="14" font-weight="650" style="fill:#0D0D10">Get started free</text>
  <text x="268" y="417" class="small muted">See how it works ↓</text><text x="88" y="463" class="tiny muted">Free forever · No credit card required</text>
