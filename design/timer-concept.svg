<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Depthly timer page design concept</title>
  <desc id="description">A dark, focused timer workspace with mode and phase controls, a large live timer, a clear primary action, session tools, and project and task context. Illustrative idle state.</desc>
  <defs>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #E8E6F0; }
      .muted { fill: #9290A4; }
      .quiet { fill: #69677B; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .small { font-size: 12px; }
      .rule { stroke: #2E2E38; stroke-width: 1; }
    </style>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171D28"/><stop offset="0.55" stop-color="#14171E"/><stop offset="1" stop-color="#141417"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="#0D0D10"/>
  <rect width="224" height="900" fill="#121317"/>
  <path d="M224 0V900M224 64H1440" class="rule"/>

  <!-- Global shell -->
  <circle cx="32" cy="31" r="13" fill="none" stroke="#E8E6F0" stroke-width="1.4"/>
  <circle cx="32" cy="31" r="8" fill="none" stroke="#7A7890" stroke-width="1"/>
  <circle cx="32" cy="31" r="2.8" fill="#4B9EFF"/>
  <text x="56" y="37" font-size="17" font-weight="650">Depthly</text>
  <text x="24" y="103" class="small quiet" letter-spacing="1.5">WORKSPACE</text>
  <rect x="12" y="159" width="200" height="42" rx="9" fill="#1C2B40"/>
  <rect x="12" y="169" width="3" height="22" rx="1.5" fill="#4B9EFF"/>
  <g class="muted" font-size="14"><text x="60" y="143">Home</text><text x="60" y="186" style="fill:#E8E6F0" font-weight="600">Timer</text><text x="60" y="229">Projects</text><text x="60" y="272">Sessions</text><text x="60" y="315">Analytics</text><text x="60" y="358">Leaderboard</text><text x="60" y="401">Billing</text></g>
  <g fill="none" stroke="#9290A4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="29" y="130" width="5" height="5" rx="1"/><rect x="38" y="130" width="5" height="5" rx="1"/><rect x="29" y="139" width="5" height="5" rx="1"/><rect x="38" y="139" width="5" height="5" rx="1"/>
    <circle cx="36" cy="181" r="8" stroke="#4B9EFF"/><path d="M36 176v5l3 2" stroke="#4B9EFF"/>
    <path d="M28 222h6l2 2h8v8H28z"/><circle cx="36" cy="267" r="8"/><path d="M36 262v5l4 2"/>
    <path d="M29 312v-7m7 7v-13m7 13v-10"/><path d="M30 347h12v7H30zM32 354l4 5 4-5"/><rect x="29" y="393" width="14" height="10" rx="2"/>
  </g>
  <path d="M0 804H224" class="rule"/>
  <circle cx="35" cy="837" r="16" fill="#253249"/><text x="35" y="842" text-anchor="middle" font-size="13" font-weight="600">M</text>
  <text x="60" y="835" font-size="13" font-weight="600">Med</text><text x="60" y="852" class="small muted">Founding plan</text>
  <text x="29" y="885" class="small muted">Settings</text>
  <text x="256" y="38" font-size="15" font-weight="600">Timer</text>
  <text x="312" y="38" class="small muted">Your focused workspace</text>
  <text x="1172" y="38" class="small muted">Tuesday, 3 November</text>
  <circle cx="1386" cy="32" r="16" fill="#253249"/><text x="1386" y="37" text-anchor="middle" font-size="13" font-weight="600">M</text>

  <!-- Page heading -->
  <text x="256" y="115" font-size="29" font-weight="600" letter-spacing="-1">Make space to focus.</text>
  <text x="256" y="143" font-size="14" class="muted">Choose your rhythm, connect your work, and begin.</text>
  <rect x="1281" y="95" width="127" height="43" rx="9" fill="#20232C" stroke="#3A3B48"/>
  <path d="M1300 109v13m-5-7h10" fill="none" stroke="#9290A4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="1315" y="121" class="small" font-weight="600">Configure</text>

  <!-- Main timer stage -->
  <rect x="256" y="169" width="812" height="688" rx="16" fill="url(#stage)" stroke="#2E2E38"/>
  <rect x="288" y="195" width="280" height="42" rx="10" fill="#20232C"/>
  <rect x="292" y="199" width="100" height="34" rx="8" fill="#233A58" stroke="#4B9EFF" stroke-opacity=".45"/>
  <text x="342" y="221" text-anchor="middle" font-size="12" font-weight="600" style="fill:#77B4FF">Pomodoro</text>
  <text x="436" y="221" text-anchor="middle" class="small muted">Custom</text>
  <text x="524" y="221" text-anchor="middle" class="small muted">Free</text>
  <text x="1036" y="221" text-anchor="end" class="small muted">25 min focus · 5 min break</text>
  <path d="M288 256H1036" class="rule"/>

  <!-- Phase switch and focal clock -->
  <text x="662" y="303" text-anchor="middle" class="small muted" letter-spacing="1.5">SESSION PHASE</text>
  <rect x="555" y="319" width="214" height="42" rx="10" fill="#20232C" stroke="#3A3B48"/>
  <rect x="559" y="323" width="103" height="34" rx="7" fill="#343D4D"/>
  <text x="611" y="345" text-anchor="middle" class="small" font-weight="600">Focus</text>
  <text x="715" y="345" text-anchor="middle" class="small muted">Break</text>

  <circle cx="662" cy="538" r="143" fill="#111720" stroke="#2B3544" stroke-width="11"/>
  <circle cx="662" cy="538" r="143" fill="none" stroke="#4B9EFF" stroke-width="11" stroke-linecap="round" stroke-dasharray="178 900" transform="rotate(-90 662 538)"/>
  <circle cx="662" cy="538" r="124" fill="none" stroke="#2B3544" stroke-width="1"/>
  <text x="662" y="535" text-anchor="middle" class="mono" font-size="67" font-weight="600" letter-spacing="-3">25:00</text>
  <text x="662" y="568" text-anchor="middle" class="small muted" letter-spacing="2">READY TO FOCUS</text>
  <text x="662" y="595" text-anchor="middle" class="small quiet">0 sessions today</text>
  <rect x="546" y="714" width="232" height="54" rx="11" fill="#4B9EFF"/>
  <path d="m569 731 15 10-15 10z" fill="#0D0D10"/>
  <text x="603" y="747" font-size="15" font-weight="650" style="fill:#0D0D10">Start focus session</text>

  <path d="M288 790H1036" class="rule"/>
  <g class="small muted" font-weight="600"><text x="313" y="825">Log</text><text x="469" y="825">Todo</text><text x="633" y="825">Fullscreen</text><text x="845" y="825">Session settings</text></g>
  <g fill="none" stroke="#9290A4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M293 814h12v14h-12zM296 819h6M296 823h5"/>
    <path d="M448 814h13v14h-13zM451 819l2 2 4-4M451 825h6"/>
    <path d="M610 819v-5h5M623 814h5v5M610 823v5h5M623 828h5v-5"/>
    <path d="M820 817h15M820 825h15M825 813v8M830 821v8"/>
  </g>

  <!-- Right rail: work context -->
  <rect x="1086" y="169" width="322" height="306" rx="16" fill="#141417" stroke="#2E2E38"/>
  <text x="1110" y="206" font-size="17" font-weight="600">What are you working on?</text>
  <text x="1110" y="230" class="small muted">Connect this session to your work.</text>
  <text x="1110" y="271" class="small muted">PROJECT</text>
  <rect x="1110" y="284" width="274" height="52" rx="9" fill="#20232C" stroke="#3A3B48"/>
  <circle cx="1130" cy="310" r="4" fill="#F25C5C"/>
  <text x="1145" y="315" font-size="14" font-weight="600">LanguageCert</text>
  <path d="m1360 307 5 5 5-5" fill="none" stroke="#9290A4" stroke-width="1.5"/>
  <text x="1110" y="369" class="small muted">TASK</text>
  <rect x="1110" y="382" width="274" height="52" rx="9" fill="#20232C" stroke="#3A3B48"/>
  <text x="1126" y="413" font-size="14" font-weight="600">Reading + Listening</text>
  <path d="m1360 405 5 5 5-5" fill="none" stroke="#9290A4" stroke-width="1.5"/>
  <text x="1110" y="455" class="small muted">You can also focus without a project.</text>

  <!-- Right rail: session structure -->
  <rect x="1086" y="493" width="322" height="201" rx="16" fill="#141417" stroke="#2E2E38"/>
  <text x="1110" y="529" font-size="17" font-weight="600">Session rhythm</text>
  <text x="1110" y="552" class="small muted">Current Pomodoro preset</text>
  <path d="M1110 577H1384" class="rule"/>
  <circle cx="1121" cy="610" r="5" fill="#4B9EFF"/>
  <text x="1138" y="615" font-size="14">Focus</text>
  <text x="1378" y="615" text-anchor="end" class="mono" font-size="14">25 min</text>
  <circle cx="1121" cy="655" r="5" fill="#7A7890"/>
  <text x="1138" y="660" font-size="14">Break</text>
  <text x="1378" y="660" text-anchor="end" class="mono" font-size="14">5 min</text>

  <rect x="1086" y="712" width="322" height="145" rx="16" fill="#141417" stroke="#2E2E38"/>
  <text x="1110" y="748" font-size="17" font-weight="600">Stay in the moment</text>
  <text x="1110" y="774" class="small muted">Fullscreen gives your timer a quieter view</text>
  <text x="1110" y="792" class="small muted">when you are ready to work.</text>
  <text x="1110" y="833" class="small" font-weight="600" style="fill:#4B9EFF">Open fullscreen →</text>

  <text x="1408" y="886" text-anchor="end" font-size="11" class="quiet">Concept only · illustrative idle state</text>
</svg>
