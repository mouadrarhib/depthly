<rect x="264" y="188" width="1128" height="132" rx="12" fill="#141417" stroke="#2e2e38"/><text x="288" y="219" font-size="14" font-weight="600">How your work connects</text><text x="1362" y="219" text-anchor="end" class="dim label">Hide guide</text><text x="288" y="258" font-size="15" font-weight="600">Create a project</text><text x="288" y="285" class="muted small">A home for a client, course, or goal.</text><text x="666" y="258" font-size="15" font-weight="600">Add tasks inside it</text><text x="666" y="285" class="muted small">Break the work into things you can finish.</text><text x="1044" y="258" font-size="15" font-weight="600">Focus on a task</text><text x="1044" y="285" class="muted small">Sessions keep time linked to your work.</text><path d="M611 260h20m-6-6 6 6-6 6" stroke="#73b4ff" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M989 260h20m-6-6 6 6-6 6" stroke="#73b4ff" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="264" y="350" width="216" height="42" rx="8" fill="#141417" stroke="#2e2e38"/><rect x="269" y="355" width="100" height="32" rx="5" fill="#292931"/><text x="282" y="376" font-size="13">Active</text><text x="348" y="376" class="data dim label">5</text><text x="383" y="376" class="muted small">Archived  2</text><rect x="498" y="350" width="300" height="42" rx="8" fill="#141417" stroke="#2e2e38"/><circle cx="519" cy="369" r="6" fill="none" stroke="#858299"/><path d="m524 374 4 4" stroke="#858299"/><text x="542" y="376" class="dim small">Search projects</text><rect x="820" y="350" width="110" height="42" rx="8" fill="#1d3048" stroke="#4b9eff"/><text x="875" y="376" text-anchor="middle" class="blue small">Filters · 2</text><text x="1392" y="376" text-anchor="end" class="muted small">Sort: Newest created ↓</text><text x="1368" y="413" text-anchor="end" class="dim label">5 of 14 projects visible · scroll for more</text><text x="288" y="436" class="dim label">PROJECT</text><text x="738" y="436" class="dim labe