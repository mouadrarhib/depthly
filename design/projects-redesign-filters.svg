<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1410" viewBox="0 0 1440 1410" role="img" aria-labelledby="title desc"><title id="title">Depthly Projects redesign proposal</title><desc id="desc">Scrollable list proposal: page controls and table headings remain fixed while project rows scroll. Projects page with a short project-to-task-to-session explanation, searchable project list, clear completion and focus columns, and explicit open project actions. Illustrative data.</desc><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#e8e6f0}.muted{fill:#aaa7ba}.dim{fill:#858299}.data{font-family:monospace}.small{font-size:13px}.label{font-size:12px}.line{stroke:#2e2e38;stroke-width:1}.blue{fill:#73b4ff}</style></defs><rect width="1440" height="1000" fill="#0d0d10"/><rect width="216" height="1000" fill="#141417"/><path d="M216 0v1000M216 64h1224" class="line"/><circle cx="32" cy="32" r="12" stroke="#b9b6c8" fill="none"/><circle cx="32" cy="32" r="7" stroke="#b9b6c8" fill="none"/><circle cx="32" cy="32" r="2" fill="#4b9eff"/><text x="54" y="38" font-size="18" font-weight="600">Depthly</text><text x="248" y="38" font-size="14">Projects</text><text x="328" y="38" class="dim small">Your focused workspace</text><text x="1120" y="38" class="dim small">0m focus today</text><circle cx="1378" cy="32" r="16" fill="#253b55"/><text x="1378" y="37" text-anchor="middle" class="small">M</text><rect x="26" y="99" width="13" height="13" rx="3" fill="none" stroke="#858299"/><text x="52" y="111" font-size="14" class="muted">Home</text><rect x="26" y="145" width="13" height="13" rx="3" fill="none" stroke="#858299"/><text x="52" y="157" font-size="14" class="muted">Timer</text><rect x="12" y="178" width="192" height="40" rx="8" fill="#1d3048"/><rect x="26" y="191" width="13" height="13" rx="3" fill="none" stroke="#73b4ff"/><text x="52" y="203" font-size="14" class="blue">Projects</text><rect x="26" y="237" width="13" height="13" rx="3" fill="none" stroke="#858299"/><text x="