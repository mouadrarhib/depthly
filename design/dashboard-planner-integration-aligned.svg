<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1180" viewBox="0 0 1360 1180" role="img" aria-labelledby="title desc">
<title id="title">Depthly dashboard with today's Planner tasks</title>
<desc id="desc">A dashboard design proposal. The focus timer remains the primary action. Today's plan sits beside it with an open task, a repeating task, and a completed task. Daily goal, weekly focus, recent sessions, and navigation remain below.</desc>
<defs><style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.heading{fill:#E8E6F0;font-weight:650;letter-spacing:-.025em}.text{fill:#D8D6E0}.muted{fill:#A6A3B7}.subtle{fill:#858299}.blue{fill:#80BCFF}.line{stroke:#2E2E38;stroke-width:1}.card{fill:#14151B;stroke:#30313C;stroke-width:1}.data{font-family:"JetBrains Mono",ui-monospace,monospace}.label{font-size:11px;letter-spacing:.09em;fill:#A6A3B7;font-weight:600}
</style>
