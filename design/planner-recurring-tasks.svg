<path d="M268 494H1030" class="line"/><text x="270" y="524" class="muted" font-size="12">Monday's checkmark stays on Monday. Thursday is a fresh occurrence.</text>
<circle cx="284" cy="564" r="10" fill="#2B4E3D" stroke="#4DCB89"/><g color="#4DCB89"><use href="#check" x="277" y="557" width="14" height="14"/></g><text x="304" y="569" class="body" font-size="12">Mon complete</text>
<circle cx="450" cy="564" r="10" fill="#2B4E3D" stroke="#4DCB89"/><g color="#4DCB89"><use href="#check" x="443" y="557" width="14" height="14"/></g><text x="470" y="569" class="body" font-size="12">Tue complete</text>
<circle cx="616" cy="564" r="10" fill="none" stroke="#8BBEFF" stroke-width="1.5" class="pulse"/><text x="636" y="569" class="body" font-size="12">Thu open</text>
<text x="270" y="690" class="faint" font-size="12">Repeats appear only on matching days. No duplicate task is added to the project.</text>
<rect x="1064" y="84" width="506" height="760" rx="16" fill="#191A21" stroke="#3B3D49"/>
<text x="1090" y="123" class="heading" font-size="20">Plan a task</text><text x="1544" y="123" class="muted" font-size="22" text-anchor="middle">×</text><path d="M1088 141H1546" class="line"/>
<text x="1090" y="179" class="label">TASK NAME</text><rect x="1090" y="190" width="454" height="45" rx="8" fill="#111218" stroke="#3B3D49"/><text x="1105" y="218" class="body" font-size="14">Review client inbox</text>
<text x="1090" y="271" class="label">PROJECT</text><rect x="1090" y="282" width="454" height="45" rx="8" fill="#111218" stroke="#3B3D49"/><text x="1105" y="310" class="body" font-size="14">Client website</text><path d="m1517 301 6 6 6-6" fill="none" stroke="#AAA7BA" stroke-width="1.5"/>
<path d="M1088 352H1546" class="line"/><text x="1090" y="388" class="heading" font-size="16">Repeat</text><text x="1090" y="410" class="muted" font-size="12">Add this task to each selected day.</text>
