<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">Depthly Planner recurring tasks concept</title>
<desc id="desc">A weekly planner with Review client inbox repeated each weekday and a task editor showing the Weekdays repeat setting. Thursday is selected, and completing that day does not complete the other occurrences.</desc>
<defs>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .heading{fill:#E8E6F0;font-weight:650;letter-spacing:-.025em}.body{fill:#D8D6E0}.muted{fill:#AAA7BA}.faint{fill:#88859C}.blue{fill:#79B7FF}.line{stroke:#30313A;stroke-width:1}.panel{fill:#15161C;stroke:#30313A;stroke-width:1}.label{font-size:12px;fill:#AAA7BA;font-weight:550}
    .pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
  </style>
  <symbol id="repeat" viewBox="0 0 20 20"><path d="M4 7h10.5l-2.4-2.4M16 13H5.5l2.4 2.4M14.5 7c1.7 0 2.5 1.1 2.5 2.8M5.5 13C3.8 13 3 11.9 3 10.2" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="check" viewBox="0 0 20 20"><path d="m4 10 4 4 8-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs>
