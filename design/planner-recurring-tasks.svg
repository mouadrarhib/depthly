<text x="244" y="35" class="heading" font-size="14">Planner</text><path d="M307 18V40" class="line"/><text x="323" y="35" class="faint" font-size="12">Your focused workspace</text><circle cx="1550" cy="29" r="16" fill="#29496E"/><text x="1550" y="34" fill="#E8E6F0" font-size="13" text-anchor="middle">M</text>
<g class="muted" font-size="14"><text x="48" y="98">Home</text><text x="48" y="144">Timer</text><text x="48" y="190">Projects</text><text x="48" y="282">Sessions</text><text x="48" y="328">Analytics</text><text x="48" y="374">Leaderboard</text><text x="48" y="420">Billing</text></g>
<rect x="8" y="210" width="202" height="42" rx="9" fill="#1F3148" stroke="#315478"/><path d="M9 215V247" stroke="#4B9EFF" stroke-width="3"/><text x="48" y="237" fill="#DDEBFF" font-size="14" font-weight="600">Planner</text><rect x="20" y="223" width="15" height="14" rx="2" fill="none" stroke="#79B7FF"/><path d="M20 228H35M25 220V225M30 220V225" stroke="#79B7FF" stroke-width="1.5"/>
<path d="M0 846H218" class="line"/><circle cx="30" cy="881" r="14" fill="#29496E"/><text x="30" y="886" fill="#E8E6F0" font-size="13" text-anchor="middle">M</text><text x="52" y="881" class="body" font-size="13">Med</text><text x="52" y="897" class="faint" font-size="11">Founding plan</text><text x="22" y="936" class="muted" font-size="13">Settings</text>
<text x="252" y="112" class="heading" font-size="31">Plan your focus</text><text x="252" y="142" class="muted" font-size="14">One task can return on the days you choose. Each day has its own checkmark.</text>
