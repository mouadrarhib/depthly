<text x="1090" y="612" class="label">STARTS</text><rect x="1090" y="625" width="220" height="43" rx="8" fill="#111218" stroke="#3B3D49"/><text x="1105" y="652" class="body" font-size="13">Nov 2, 2026</text><text x="1326" y="612" class="label">ENDS</text><rect x="1326" y="625" width="218" height="43" rx="8" fill="#111218" stroke="#3B3D49"/><text x="1341" y="652" class="body" font-size="13">No end date</text>
<rect x="1090" y="693" width="454" height="64" rx="9" fill="#172535"/><text x="1105" y="718" fill="#C9E1FF" font-size="13" font-weight="600">One task, separate daily progress</text><text x="1105" y="740" fill="#AFC8E5" font-size="12">Focus time stays linked to this task and project.</text>
<path d="M1088 779H1546" class="line"/><text x="1392" y="814" class="muted" font-size="13" text-anchor="middle">Cancel</text><rect x="1444" y="789" width="100" height="39" rx="8" fill="#4B9EFF"/><text x="1494" y="814" fill="#0D1723" font-size="13" font-weight="700" text-anchor="middle">Save task</text>
<text x="252" y="810" class="faint" font-size="12">Illustrative concept · sample client task and dates</text>
</svg>
