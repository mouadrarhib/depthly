<text x="252" y="197" class="heading" font-size="20">Nov 2 – Nov 8</text><text x="424" y="197" class="muted" font-size="18">‹　›</text><rect x="930" y="173" width="116" height="39" rx="8" fill="#4B9EFF"/><text x="988" y="198" fill="#0D1723" font-size="13" font-weight="700" text-anchor="middle">+ Add task</text>
<rect x="252" y="228" width="794" height="518" rx="14" class="panel"/>
