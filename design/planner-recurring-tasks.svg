  <g fill="#AFC9E8" font-size="10"><text x="287" y="396">Daily repeat</text><text x="400" y="396">Daily repeat</text><text x="513" y="396">Daily repeat</text><text x="626" y="396">Daily repeat</text><text x="739" y="396">Daily repeat</text></g>
</g>
