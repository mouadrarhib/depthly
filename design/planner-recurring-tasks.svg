<g>
  <rect x="262" y="341" width="93" height="65" rx="8" fill="#243A56"/><rect x="375" y="341" width="93" height="65" rx="8" fill="#243A56"/><rect x="488" y="341" width="93" height="65" rx="8" fill="#243A56"/><rect x="601" y="341" width="93" height="65" rx="8" fill="#2A4B70" stroke="#4B9EFF"/><rect x="714" y="341" width="93" height="65" rx="8" fill="#243A56"/>
  <g fill="#D7E9FF" font-size="11" font-weight="600"><text x="270" y="361">Review client</text><text x="270" y="378">inbox</text><text x="383" y="361">Review client</text><text x="383" y="378">inbox</text><text x="496" y="361">Review client</text><text x="496" y="378">inbox</text><text x="609" y="361">Review client</text><text x="609" y="378">inbox</text><text x="722" y="361">Review client</text><text x="722" y="378">inbox</text></g>
