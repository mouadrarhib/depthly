<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Depthly — work at depth. Focus sessions, streaks, and deep work analytics." />
    <meta name="theme-color" content="#F7F8FA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Depthly" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Depthly's type system: Inter for UI, JetBrains Mono for all data -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Depthly</title>
    <script>
      ;(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('ui-preferences') || '{}')
          const preference = saved?.state?.theme || 'system'
          const dark = preference === 'dark' ||
            (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          const root = document.documentElement
          root.classList.add(dark ? 'dark' : 'light')
          root.dataset.theme = dark ? 'dark' : 'light'
          root.style.colorScheme = dark ? 'dark' : 'light'
          document.querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', dark ? '#0D0D10' : '#F7F8FA')
        } catch {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
